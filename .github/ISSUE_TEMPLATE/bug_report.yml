name: Bug report
description: Something in @nuvui/react or the docs site doesn't behave the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A link to a repo or sandbox, or the smallest snippet that shows the problem. Bugs we can't reproduce usually can't be fixed.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Component behavior
        - Styles or tokens
        - Accessibility
        - Types
        - Build or packaging
        - Docs site
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "@nuvui/react version"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: react
    attributes:
      label: React and framework versions
      placeholder: "React 19.3, Next.js 16.3"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: Skip this for build, type or server rendering problems.
      placeholder: "Firefox 143 on Windows 11"

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Console errors, screenshots, a guess at the cause.
