name: Feature request
description: A new component, a new option on an existing one, or a change to tokens or tooling.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem, not the solution. What can't you build today, or what's awkward?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A rough API sketch helps if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
      description: Including "none". This tells us how urgent it is.

  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - New component
        - New prop or variant on an existing component
        - Tokens or theming
        - Docs
        - Tooling or build
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you work on this?
      options:
        - label: I'm willing to open a pull request for it
