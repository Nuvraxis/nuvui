# The workflows name each action by the commit it's at, so that a tag moved
# to other code can't change what runs. That leaves nothing to follow new
# releases, which is what this does: once a week it opens a pull request
# that moves an action to its latest release, commit and comment both.
#
# The site's image names its two base images by digest for the same reason,
# and they're followed the same way.
#
# npm dependencies aren't here. They're updated by hand, a group at a time,
# because several of them have to move together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /apps
    schedule:
      interval: weekly
    groups:
      images:
        patterns:
          - "*"
    # The image builds with the Node in .nvmrc, and that's moved by hand.
    # Node 25 has no Corepack in it, and the build with it failed at its
    # first step.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
