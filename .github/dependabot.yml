# The workflows name each action by the commit it's at, so that a tag moved
# to other code can't change what runs. That leaves nothing to follow new
# releases, which is what this does: once a week it opens a pull request
# that moves an action to its latest release, commit and comment both.
#
# The images of the site and of the MCP server name their base images by
# digest for the same reason, and they're followed the same way. Dependabot
# reads only the Dockerfile in each folder it's given, not in the folders
# under it, so each image's folder is named.
#
# npm dependencies aren't here. They're updated by hand, a group at a time,
# because several of them have to move together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /apps
      - /apps/mcp
    schedule:
      interval: weekly
    groups:
      images:
        patterns:
          - "*"
    # A new major of Node is moved to by hand, after the site and the MCP
    # server are built and run on it. Minors and patches come from here.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
