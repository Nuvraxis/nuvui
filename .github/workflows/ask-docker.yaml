name: Ask Docker

# Builds the image of the service behind the Ask AI panel from
# apps/ask/Dockerfile, starts it, checks that it answers, and pushes it to
# GitHub's container registry as ghcr.io/nuvraxis/nuvui-ask. The cluster
# sends /api/ask on the site's own address to it. apps/ask/README.md has
# what it needs to run there.
#
# A push to main that changes what the service is built from pushes an
# image: its own code, the MCP server's code its tools and data come from,
# or the docs it answers from. A pull request that changes how
# the image is made builds and checks one, and pushes nothing.
#
# Every image pushed has the tag sha-<commit>, which never moves, and
# `latest`, which does. Deploy the first, or the digest in the run's
# summary.
on:
  push:
    branches: [main]
    paths:
      - "apps/ask/**"
      - "apps/mcp/src/**"
      - "skills/nuvui/**"
      - "apps/docs/content/docs/agents.mdx"
      - "apps/docs/content/docs/mcp.mdx"
      - "apps/showcase/src/blocks/**"
      - "apps/showcase/src/charts/**"
      - "apps/showcase/src/lib/charts.ts"
      - "packages/ui/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/ask-docker.yaml"
  pull_request:
    paths:
      - "apps/ask/**"
      - ".dockerignore"
      - ".github/workflows/ask-docker.yaml"
  workflow_dispatch:

concurrency:
  group: ask-docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/nuvraxis/nuvui-ask
  BUILD_ARGS: |
    SERVICE_VERSION=${{ github.sha }}
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  image:
    name: Build, check and push the ask service's image
    if: github.repository == 'Nuvraxis/nuvui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Work out the tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=nuvui ask service
            org.opencontainers.image.description=Answers a visitor's question about nuvui from the docs, for the Ask AI panel.

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ask/Dockerfile
          load: true
          tags: nuvui-ask:check
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=ask
          cache-to: type=gha,mode=max,scope=ask

      # Started the way a locked-down pod would be.
      - name: Start it
        id: start
        run: >-
          docker run --detach --name ask
          --publish 8080:8080 --publish 9464:9464
          --read-only --cap-drop ALL
          --security-opt no-new-privileges
          --env AZURE_OPENAI_ENDPOINT=https://example.invalid
          --env AZURE_OPENAI_DEPLOYMENT=check
          --env AZURE_OPENAI_API_VERSION=check
          --env ANSWER_TIMEOUT_MS=20000
          nuvui-ask:check

      # The runner has no Azure credential and the endpoint doesn't exist,
      # so the model is never reached: the stream ends with an error, and
      # the count has it. Signing in can fail outright, or wait on the
      # metadata endpoint until the answer's time is up, so either is a pass.
      - name: Check that it answers
        run: |
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8080/readyz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"question":""}' \
            http://localhost:8080/api/ask)
          test "$status" = 400
          stream=$(curl -fsS -D - -X POST -H 'Content-Type: application/json' \
            -d '{"question":"How do I sort a table?"}' http://localhost:8080/api/ask)
          echo "$stream"
          grep -qi '^content-type: text/event-stream' <<<"$stream"
          grep -qi '^x-accel-buffering: no' <<<"$stream"
          grep -Eq '^data: \{"error":"(failed|timeout)"\}' <<<"$stream"
          curl -fsS http://localhost:9464/metrics | grep -Eq '^nuvui_ask_questions_total\{outcome="(failed|timeout)"\} 1$'

      - name: Show the container's log
        if: failure() && steps.start.outcome == 'success'
        run: docker logs ask

      - name: Sign in to the registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push it, for amd64 and arm64
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ask/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ env.BUILD_ARGS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ask

      - name: Say what was pushed
        if: env.PUSH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "$TAGS"
            echo
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
