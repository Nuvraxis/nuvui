name: CI

# Pull requests only. A merge to main doesn't run this again, so the checks
# on the pull request are the only ones a change gets.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: pnpm --filter @nuvui/react exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:e2e

      - name: Check the package that would be published
        run: pnpm --filter @nuvui/react check:package

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-output
          path: |
            apps/docs/playwright-report
            apps/docs/test-results
            packages/ui/.vitest
          if-no-files-found: ignore
          retention-days: 7
