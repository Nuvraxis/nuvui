name: CI

# Pull requests only. A merge to main doesn't run this again, so the checks
# on the pull request are the only ones a change gets.
#
# The end-to-end tests and the consumer apps are in e2e.yml, which only runs
# for a pull request with the invoke-e2e label.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The component tests run in real browsers.
      - name: Install Playwright's browsers
        run: pnpm --filter @nuvui/react exec playwright install --with-deps chromium firefox webkit

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

      - name: Check the package that would be published
        run: pnpm --filter @nuvui/react check:package

      # Fails when an entry point grows past its budget in
      # packages/ui/.size-limit.json.
      - run: pnpm size

      - name: Upload the component tests' output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-output
          path: packages/ui/.vitest
          if-no-files-found: ignore
          retention-days: 7
