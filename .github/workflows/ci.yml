name: CI

# Pull requests only. A merge to main doesn't run this again, so the checks
# on the pull request are the only ones a change gets.
#
# The end-to-end tests and the consumer apps are in e2e.yml, which only runs
# for a pull request with the invoke-e2e label.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The component tests run in real browsers.
      - name: Install Playwright's browsers
        run: pnpm --filter @nuvui/react exec playwright install --with-deps chromium firefox webkit

      # Before anything is built: a dependency with a known vulnerability,
      # or with a license nobody has read, stops the run here. The list of
      # licenses is in scripts/check-licenses.mjs, and what the audit leaves
      # out is in pnpm-workspace.yaml, with why.
      - name: Audit the dependencies
        run: pnpm check:audit
      - name: Check the dependencies' licenses
        run: pnpm check:licenses

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # One package's tests at a time. Each opens three browsers, and the
      # runner has two cores: with several packages at once, a page can go
      # seconds without answering, and tests fail that aren't wrong.
      - run: pnpm test --concurrency=1

      - name: Check the packages that would be published
        run: pnpm check:package

      # Fails when an entry point grows past its budget in its package's
      # .size-limit.json.
      - run: pnpm size

      - name: Upload the component tests' output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-output
          path: packages/*/.vitest
          if-no-files-found: ignore
          retention-days: 7
