name: CI

# Pull requests only. A merge to main doesn't run this again, so the checks
# on the pull request are the only ones a change gets.
#
# The end-to-end tests and the consumer apps are in e2e.yml, which only runs
# for a pull request with the invoke-e2e label.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Microsoft's image for Playwright, with its browsers and the system
    # libraries they need already in it. Installing those libraries on the
    # bare runner came from Ubuntu's mirror, which some days took longer
    # than the whole job may.
    #
    # Its version is Playwright's, in pnpm-workspace.yaml: raise both
    # together. Dependabot doesn't. Until they match, the browsers step
    # downloads the builds the newer version wants, which takes a minute.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # The runner's own user, not root: Firefox won't start as root in a
      # home folder that root doesn't own.
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The component tests run in real browsers. The image has them, and
      # this finds them and does nothing. Without --with-deps: the image has
      # the system libraries, and the job isn't root, so it can't add any.
      - name: Install Playwright's browsers
        run: node scripts/playwright-browsers.mjs

      # Before anything is built: a dependency with a known vulnerability,
      # or with a license nobody has read, stops the run here. The list of
      # licenses is in scripts/check-licenses.mjs, and what the audit leaves
      # out is in pnpm-workspace.yaml, with why.
      - name: Audit the dependencies
        run: pnpm check:audit
      - name: Check the dependencies' licenses
        run: pnpm check:licenses

      - run: pnpm lint
      - run: pnpm typecheck
      # The scripts that have tests of their own, which need no browser.
      - run: pnpm test:scripts
      - run: pnpm build
      # The agent skill is written from the docs and kept in git. This fails
      # when a change to the docs or a component hasn't been carried over,
      # and when a component is on no docs page. It reads the built
      # stylesheets, so it's after the build.
      - name: Check the agent skill against the docs
        run: pnpm check:skill
      # One package's tests at a time. Each opens three browsers, and the
      # runner has two cores: with several packages at once, a page can go
      # seconds without answering, and tests fail that aren't wrong.
      - run: pnpm test --concurrency=3

      - name: Check the packages that would be published
        run: pnpm check:package

      # Fails when an entry point grows past its budget in its package's
      # .size-limit.json.
      - run: pnpm size

      - name: Upload the component tests' output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-output
          path: packages/*/.vitest
          if-no-files-found: ignore
          retention-days: 7
