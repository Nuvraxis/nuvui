name: E2E report

# Writes what the end-to-end tests found on the pull request: one comment,
# kept up to date from run to run. It says which tests failed and in which
# browser setups, and how to run them again.
#
# This is a workflow of its own, started when E2E finishes, because E2E runs
# with a pull request's code and so may not write to the pull request: for a
# fork that code is a stranger's. This one runs the code on the default
# branch and only reads the results E2E kept. scripts/e2e-comment.mjs treats
# those as text from a stranger.
#
# Like every workflow started this way, it's the copy on the default branch
# that runs. A change to it does nothing until it's merged.
on:
  workflow_run:
    workflows: [E2E]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Write the results on the pull request
    # Not for a run whose jobs were all skipped, which is every pull request
    # without the label, and not for one that was cancelled by a newer push.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure')
    # Nothing here runs a pull request's code, and it needs no more than a
    # minute. GitHub's own runner, which is thrown away afterwards.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # To read the results E2E kept, and the list of its jobs.
      actions: read
      contents: read
      pull-requests: write
    steps:
      # The default branch, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # There are none when the build failed before any slice ran. The list
      # of jobs that failed is still written.
      - name: Get the slices' results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-report-*
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Everything about the run goes in through the environment, so none
      # of it is read as part of a command.
      - name: Write the comment
        run: node scripts/e2e-comment.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPORTS: reports
