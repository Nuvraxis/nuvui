name: E2E

# The slow checks: Playwright against the built website and docs, and the packed
# library installed into a Vite and a Next.js app. They run for a pull request
# that has the invoke-e2e label, and not otherwise.
#
# Adding the label starts a run. While the label stays on, so does every push
# to the pull request. Take the label off to stop that.
#
# There are about 9,900 tests: the docs' and the website's, each in five
# browser setups. The site is built once, and the tests are cut into slices
# that run at the same time.
#
# The runners are six containers on two machines, each given three CPUs:
# four on a laptop whose CPUs are two threads to a core, and two on a Mac
# mini whose CPUs are whole cores. So the slices are cut by engine as well.
# Chromium and Firefox are four slices, and Safari's engine is six. On
# Linux that engine draws in software, in several processes, and on the
# laptop's shared cores it's the one that falls behind and fails tests that
# aren't wrong.
#
# Which runners a slice goes to is two repository variables (Settings,
# Secrets and variables, Actions, Variables), each the name of a label the
# runners have:
#
#   E2E_RUNNER          for the build, the consumer apps, and the Chromium
#                       and Firefox slices. `laptop` when it isn't set.
#   E2E_WEBKIT_RUNNER   for the WebKit slices. The same as E2E_RUNNER when
#                       it isn't set.
#
# With neither set, every job goes to any runner labelled `laptop`, which
# is how it was before the slices were cut by engine. To keep WebKit off
# the laptop, give the Mac mini's runners a label of their own and set
# E2E_WEBKIT_RUNNER to it. A label no runner has leaves its jobs waiting
# until the run is cancelled, so add the label before the variable.
#
# Each slice runs as many workers as its own container has CPUs. With a
# slice left to use every core of the machine it's on, browsers stop
# answering. The consumer apps are a job of their own, which takes a minute
# and has the first runner that's free. Each slice also has a port of its
# own for its server, in case two runners share a network.
#
# How long a run takes is the CPUs the containers are given, more than
# anything here: each slice's log says how many it found. If the runners
# change, change the slices to match.
#
# Only for a pull request from a branch of this repository. One from a fork
# is a stranger's code, and these runners are a machine of ours that isn't
# thrown away after a job.
#
# On GitHub's own runners it's the other way about: two cores each, and as
# many runners as there are jobs. There, more slices with `workers` left
# out is what's quick.
#
# What failed is written on the pull request by e2e-report.yml, and a
# comment there of `retry:failed` runs it again, through e2e-retry.yml.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# A label other than invoke-e2e also starts this workflow, with its jobs
# skipped. Such a run gets a group of its own, so it can't cancel a run that
# is doing the work.
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event.action != 'labeled' || github.event.label.name == 'invoke-e2e' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    # The other jobs need this one, so what stops it stops them all.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'invoke-e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'invoke-e2e')
    runs-on: [self-hosted, "${{ vars.E2E_RUNNER || 'laptop' }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # What the other jobs need and can't make without building: the
      # packages' dist folders, and the two exported sites.
      - name: Keep what was built for the other jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built
          path: |
            packages/*/dist
            apps/docs/out
            apps/showcase/out
          if-no-files-found: error
          retention-days: 1
          # A run that's started again builds again, under the same name.
          overwrite: true

  test:
    name: ${{ matrix.app }} ${{ matrix.name }} ${{ matrix.slice }} of ${{ matrix.of }}
    needs: build
    runs-on:
      - self-hosted
      - ${{ matrix.webkit && (vars.E2E_WEBKIT_RUNNER || vars.E2E_RUNNER || 'laptop') || (vars.E2E_RUNNER || 'laptop') }}
    # A slice is some 1,400 tests. With two workers, which is what a
    # runner given three of the laptop's CPUs gets, the 1,700 of a slice
    # as they were cut before took fifty-four minutes.
    timeout-minutes: 60
    strategy:
      # One slice failing says nothing about the others. Let them finish, so
      # one run shows everything that's wrong.
      fail-fast: false
      matrix:
        include:
          # Chromium, as a desktop and as a phone, and Firefox: 4,287 of
          # the docs' tests and 1,668 of the website's. Four slices, one to
          # each of the laptop's runners.
          #
          # `id` is the slice's number among its app's, which is what its
          # results are kept under: scripts/e2e-comment.mjs adds up
          # e2e-report-<app>-<number>.
          - { app: docs, name: Chromium and Firefox, engines: "chromium,firefox", webkit: false, slice: 1, of: 3, port: 3101, id: 1 }
          - { app: docs, name: Chromium and Firefox, engines: "chromium,firefox", webkit: false, slice: 2, of: 3, port: 3102, id: 2 }
          - { app: docs, name: Chromium and Firefox, engines: "chromium,firefox", webkit: false, slice: 3, of: 3, port: 3103, id: 3 }
          - { app: showcase, name: Chromium and Firefox, engines: "chromium,firefox", webkit: false, slice: 1, of: 1, port: 3201, id: 1 }
          # Safari's engine, as a desktop and as an iPhone: 2,858 of the
          # docs' tests and 1,112 of the website's. It's the slow one. On
          # the laptop a slice of 1,429 had passed some 1,090 when its hour
          # ran out, which is eighteen tests a minute, so a slice is kept
          # to about 700. That's more slices than there are runners, and
          # the later ones wait for a runner to be free.
          - { app: docs, name: WebKit, engines: webkit, webkit: true, slice: 1, of: 4, port: 3111, id: 4 }
          - { app: docs, name: WebKit, engines: webkit, webkit: true, slice: 2, of: 4, port: 3112, id: 5 }
          - { app: docs, name: WebKit, engines: webkit, webkit: true, slice: 3, of: 4, port: 3113, id: 6 }
          - { app: docs, name: WebKit, engines: webkit, webkit: true, slice: 4, of: 4, port: 3114, id: 7 }
          - { app: showcase, name: WebKit, engines: webkit, webkit: true, slice: 1, of: 2, port: 3211, id: 2 }
          - { app: showcase, name: WebKit, engines: webkit, webkit: true, slice: 2, of: 2, port: 3212, id: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Get what was built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built

      - name: Install Playwright's browsers
        run: node scripts/playwright-browsers.mjs --with-deps

      # Playwright is run directly, not through `pnpm test:e2e`: that task
      # builds first, and the build is already here.
      #
      # As many workers as the container has CPUs. Not as many as `nproc`
      # says: a container given three CPUs of a twelve-thread machine is
      # told twelve, and it's the limit Docker wrote down that's true. With
      # no limit, it's every core, as on a runner with a machine to itself.
      #
      # Where the machine's CPUs are two threads to a core, three of them
      # aren't three cores, and with every runner on it at work they're
      # nearer half that. Three browsers on them ran out of time in tests
      # that aren't wrong. There it's two workers for three CPUs.
      #
      # NUVUI_BROWSERS is what cuts the slice by engine: the Playwright
      # config keeps the projects whose engine it names.
      - name: Run slice ${{ matrix.slice }} of ${{ matrix.of }}
        run: |
          workers=$(nproc)
          if [ -r /sys/fs/cgroup/cpu.max ] && read -r quota period < /sys/fs/cgroup/cpu.max && [ "$quota" != "max" ]; then
            workers=$(( quota / period ))
          fi
          cpus=$workers
          threads=$(lscpu 2> /dev/null | awk -F: '/^Thread\(s\) per core/ { gsub(/ /, "", $2); print $2 }')
          if [ "${threads:-1}" -gt 1 ]; then workers=$(( (workers * 2 + 2) / 3 )); fi
          if [ "$workers" -lt 1 ]; then workers=1; fi
          echo "$(nproc) CPUs on the machine, ${threads:-1} to a core, and $cpus for this runner. Running with $workers workers."
          NUVUI_E2E_WORKERS=$workers pnpm --filter "@nuvui/$APP" exec playwright test --shard="$SLICE"
        env:
          APP: ${{ matrix.app }}
          SLICE: ${{ matrix.slice }}/${{ matrix.of }}
          NUVUI_E2E_PORT: ${{ matrix.port }}
          NUVUI_BROWSERS: ${{ matrix.engines }}

      # Passed or failed. e2e-report.yml reads these to write what failed
      # on the pull request.
      - name: Keep the slice's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.app }}-${{ matrix.id }}
          path: apps/${{ matrix.app }}/test-results/results.json
          if-no-files-found: ignore
          retention-days: 7
          # A slice that's run again replaces what it said the first time.
          overwrite: true

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.app }}-${{ matrix.id }}
          path: |
            apps/${{ matrix.app }}/playwright-report
            apps/${{ matrix.app }}/test-results
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  consumers:
    name: Install the packed library into a Vite and a Next.js app
    needs: build
    runs-on: [self-hosted, "${{ vars.E2E_RUNNER || 'laptop' }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Get what was built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built

      - run: pnpm test:consumers

  # One job that says how all of it went, to name in a branch protection
  # rule. A rule can't name the slices: there's one check for each, and the
  # names change when a slice is added.
  e2e:
    name: E2E
    if: always() && needs.build.result != 'skipped'
    needs: [build, test, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if anything before this did
        if: >-
          needs.build.result != 'success' ||
          needs.test.result != 'success' ||
          needs.consumers.result != 'success'
        run: exit 1
      - run: echo "Every slice passed, and the consumer apps built."
