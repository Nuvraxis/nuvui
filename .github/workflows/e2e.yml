name: E2E

# The slow checks: Playwright against the built website and docs, and the packed
# library installed into a Vite and a Next.js app. They run for a pull request
# that has the invoke-e2e label, and not otherwise.
#
# Adding the label starts a run. While the label stays on, so does every push
# to the pull request. Take the label off to stop that.
#
# There are about 7,750 tests: the docs' and the website's, each in five
# browser setups. The site is built once, and the tests are cut into slices
# that run at the same time.
#
# The runners are eight containers on one machine. So there are seven jobs
# after the build, and none waits for a runner: six slices, and the consumer
# apps. The slices share the machine's cores, which is why each runs a sixth
# of them as workers, and no more. With every slice left to use every core,
# browsers stop answering and tests fail that aren't wrong. Each also has a
# port of its own for its server, in case the runners share a network.
#
# How long a run takes is the cores the containers are given, more than
# anything here: each slice's log says how many it found.
#
# Only for a pull request from a branch of this repository. One from a fork
# is a stranger's code, and these runners are a machine of ours that isn't
# thrown away after a job.
#
# On GitHub's own runners it's the other way about: two cores each, and as
# many runners as there are jobs. There, more slices with `workers` left
# out is what's quick.
#
# What failed is written on the pull request by e2e-report.yml, and a
# comment there of `retry:failed` runs it again, through e2e-retry.yml.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

# A label other than invoke-e2e also starts this workflow, with its jobs
# skipped. Such a run gets a group of its own, so it can't cancel a run that
# is doing the work.
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event.action != 'labeled' || github.event.label.name == 'invoke-e2e' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    # The other jobs need this one, so what stops it stops them all.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'invoke-e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'invoke-e2e')
    runs-on: [self-hosted, laptop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # What the other jobs need and can't make without building: the
      # packages' dist folders, and the two exported sites.
      - name: Keep what was built for the other jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built
          path: |
            packages/*/dist
            apps/docs/out
            apps/showcase/out
          if-no-files-found: error
          retention-days: 1
          # A run that's started again builds again, under the same name.
          overwrite: true

  test:
    name: ${{ matrix.app }} ${{ matrix.slice }} of ${{ matrix.of }}
    needs: build
    runs-on: [self-hosted, laptop]
    # A docs slice is some 1,700 tests. With two workers, which is what a
    # runner given 12 cores gets, that has come close to forty minutes.
    timeout-minutes: 60
    strategy:
      # One slice failing says nothing about the others. Let them finish, so
      # one run shows everything that's wrong.
      fail-fast: false
      matrix:
        include:
          # The docs have about twice the website's tests, so twice its
          # slices. Six in all: SLICES below has to say the same.
          - { app: docs, slice: 1, of: 4, port: 3101 }
          - { app: docs, slice: 2, of: 4, port: 3102 }
          - { app: docs, slice: 3, of: 4, port: 3103 }
          - { app: docs, slice: 4, of: 4, port: 3104 }
          - { app: showcase, slice: 1, of: 2, port: 3201 }
          - { app: showcase, slice: 2, of: 2, port: 3202 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Get what was built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built

      - name: Install Playwright's browsers
        run: node scripts/playwright-browsers.mjs --with-deps

      # Playwright is run directly, not through `pnpm test:e2e`: that task
      # builds first, and the build is already here.
      #
      # Each slice runs a sixth of the cores as workers, so the six of them
      # use the machine and no more. It's the cores that are really here: a
      # container can be given part of the machine, and the log says how
      # many it was.
      - name: Run slice ${{ matrix.slice }} of ${{ matrix.of }}
        run: |
          cores=$(nproc)
          workers=$(( cores / SLICES ))
          if [ "$workers" -lt 1 ]; then workers=1; fi
          echo "$cores cores here. Running with $workers workers."
          NUVUI_E2E_WORKERS=$workers pnpm --filter "@nuvui/$APP" exec playwright test --shard="$SLICE"
        env:
          APP: ${{ matrix.app }}
          SLICE: ${{ matrix.slice }}/${{ matrix.of }}
          SLICES: 6
          NUVUI_E2E_PORT: ${{ matrix.port }}

      # Passed or failed. e2e-report.yml reads these to write what failed
      # on the pull request.
      - name: Keep the slice's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.app }}-${{ matrix.slice }}
          path: apps/${{ matrix.app }}/test-results/results.json
          if-no-files-found: ignore
          retention-days: 7
          # A slice that's run again replaces what it said the first time.
          overwrite: true

      - name: Upload Playwright output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.app }}-${{ matrix.slice }}
          path: |
            apps/${{ matrix.app }}/playwright-report
            apps/${{ matrix.app }}/test-results
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  consumers:
    name: Install the packed library into a Vite and a Next.js app
    needs: build
    runs-on: [self-hosted, laptop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Get what was built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built

      - run: pnpm test:consumers

  # One job that says how all of it went, to name in a branch protection
  # rule. A rule can't name the slices: there's one check for each, and the
  # names change when a slice is added.
  e2e:
    name: E2E
    if: always() && needs.build.result != 'skipped'
    needs: [build, test, consumers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if anything before this did
        if: >-
          needs.build.result != 'success' ||
          needs.test.result != 'success' ||
          needs.consumers.result != 'success'
        run: exit 1
      - run: echo "Every slice passed, and the consumer apps built."
