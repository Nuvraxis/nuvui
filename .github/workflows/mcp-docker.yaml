name: MCP Docker

# Builds the MCP server's image from apps/mcp/Dockerfile, starts it, checks
# that it answers, and pushes it to GitHub's container registry as
# ghcr.io/nuvraxis/nuvui-mcp. The server is meant to be reached at /mcp on
# the site's own address, where the ingress sends that path to it.
#
# A push to main that changes what the server is built from pushes an
# image: its own code, or the skill and the website's blocks and charts,
# which are its data. A pull request that changes how the image is made
# builds and checks one, and pushes nothing. So does a run started by hand
# on a branch other than main.
#
# Every image pushed has the tag sha-<commit>, which never moves, and
# `latest`, which does. Deploy the first, or the digest in the run's
# summary.
on:
  push:
    branches: [main]
    paths:
      - "apps/mcp/**"
      - "skills/nuvui/**"
      - "apps/showcase/src/blocks/**"
      - "apps/showcase/src/charts/**"
      - "apps/showcase/src/lib/charts.ts"
      - "packages/ui/package.json"
      - "scripts/check-mcp-image.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - ".github/workflows/mcp-docker.yaml"
  pull_request:
    paths:
      - "apps/mcp/Dockerfile"
      - "scripts/check-mcp-image.mjs"
      - ".dockerignore"
      - ".github/workflows/mcp-docker.yaml"
  workflow_dispatch:

# On main every run finishes, so each commit that changes the server has an
# image. On a pull request only the newest push matters.
concurrency:
  group: mcp-docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The registry wants lowercase, and the organization's name has a capital.
  IMAGE: ghcr.io/nuvraxis/nuvui-mcp
  # The same for both builds below, so the second is made from the cache of
  # the first and pushes what was checked.
  BUILD_ARGS: |
    SERVICE_VERSION=${{ github.sha }}
  PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  image:
    name: Build, check and push the MCP server's image
    # Forks have no registry of this name to push to.
    if: github.repository == 'Nuvraxis/nuvui'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Work out the tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=nuvui MCP server
            org.opencontainers.image.description=An MCP server that answers a coding agent's questions about nuvui.

      # For this runner only, and kept on it. An image for two
      # architectures can't be loaded into Docker to be run.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/mcp/Dockerfile
          load: true
          tags: nuvui-mcp:check
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

      # Started the way a locked-down pod would be: a read-only root
      # filesystem, no capabilities, and a user that isn't root. The limit
      # is lowered so the check can reach it.
      - name: Start it
        id: start
        run: >-
          docker run --detach --name mcp --publish 8080:8080
          --read-only --cap-drop ALL
          --security-opt no-new-privileges
          --env RATE_LIMIT_PER_MINUTE=30
          nuvui-mcp:check

      - name: Check that it answers
        run: node scripts/check-mcp-image.mjs http://localhost:8080 30

      # Only when there's a container to have one. After a failed build
      # there isn't, and a second error would hide the first.
      - name: Show the container's log
        if: failure() && steps.start.outcome == 'success'
        run: docker logs mcp

      - name: Sign in to the registry
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push it, for amd64 and arm64
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ env.BUILD_ARGS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stored in the registry with the image: how it was built, and a
          # list of what's in it.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=mcp

      - name: Say what was pushed
        if: env.PUSH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            echo "$TAGS"
            echo
            echo "$IMAGE@$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
