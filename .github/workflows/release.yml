name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Forks shouldn't try to publish.
    if: github.repository == 'Nuvraxis/nuvui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Lets the registry verify where the package was built (provenance).
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # registry-url writes an .npmrc that reads the token from
      # NODE_AUTH_TOKEN. There's no dependency cache here on purpose: what
      # gets published is built from a fresh install.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # With pending changesets this opens or updates a "Version packages"
      # pull request. Once that PR is merged and no changesets are left, it
      # builds and publishes instead. v2 of the action is the one that works
      # with Changesets 3. It hands its GitHub token to both scripts, which
      # the changelog needs to look up pull requests.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: Version packages
          commit-message: Version packages
        env:
          # TODO(Nuvraxis): add an NPM_TOKEN repository secret with publish
          # rights to the @nuvui scope, or switch this job to trusted
          # publishing and remove this line.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The registry only accepts provenance from a public repository.
          NPM_CONFIG_PROVENANCE: true
