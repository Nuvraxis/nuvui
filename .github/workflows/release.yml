name: Release

# Only for a push that changes a package or a changeset. Those are the two
# things this workflow acts on: a changeset is what makes it open the
# "Version packages" pull request, and merging that pull request changes
# every package's version and changelog, which is what makes it publish. A
# push that only touches the docs, the website or the workflows doesn't run
# it.
#
# It can also be started by hand from the Actions tab, for a run that
# failed for a reason outside the repository, such as an expired token.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".changeset/**"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Forks shouldn't try to publish, and a run started by hand on another
    # branch shouldn't publish what isn't on main.
    if: github.repository == 'Nuvraxis/nuvui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Lets the registry verify where the package was built (provenance).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # registry-url writes an .npmrc that reads the token from
      # NODE_AUTH_TOKEN. There's no dependency cache here on purpose: what
      # gets published is built from a fresh install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # With pending changesets this opens or updates a "Version packages"
      # pull request. Once that PR is merged and no changesets are left, it
      # builds and publishes instead. v2 of the action is the one that works
      # with Changesets 3. It hands its GitHub token to both scripts, which
      # the changelog needs to look up pull requests.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: Version packages
          commit-message: Version packages
        env:
          # A repository secret, with publish rights to the @nuvui scope.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The registry only accepts provenance from a public repository.
          NPM_CONFIG_PROVENANCE: true
