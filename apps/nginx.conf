# Serves the exported site the way scripts/serve-static.mjs does for the
# tests: addresses without `.html`, and 404.html for what isn't there.
# apps/Dockerfile copies this over the image's default server.

# A file under _next/static has a hash of its contents in its name, so it
# can be kept for good. Everything else is asked for again each time.
map $uri $cache_control {
  default                     "no-cache";
  ~^/(?:docs/)?_next/static/  "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;

  server_tokens off;
  # A redirect that names only the path. This server is behind an ingress
  # and doesn't know the host or the port a visitor sees.
  absolute_redirect off;

  charset utf-8;
  charset_types text/css text/plain application/javascript application/json
    application/xml image/svg+xml;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css text/plain application/javascript application/json
    application/xml image/svg+xml;

  # Not `always`: a 404 for a hashed file must not be kept. During a
  # rollout an old pod can be asked for a file only the new ones have.
  add_header Cache-Control $cache_control;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # No Content-Security-Policy and no Strict-Transport-Security here. The
  # first isn't written yet, and the second belongs to whatever ends TLS.

  # One address per page: `.html` and a slash at the end go to the address
  # without. These read the address as it was asked for, so the 404 page
  # below isn't caught by them.
  if ($request_uri ~ "^/index\.html(\?.*)?$") {
    return 301 /$1;
  }
  if ($request_uri ~ "^([^?]+?)(?:/index)?\.html(\?.*)?$") {
    return 301 $1$2;
  }
  if ($request_uri ~ "^([^?]+?)/+(\?.*)?$") {
    return 301 $1$2;
  }

  # For a liveness and a readiness probe.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ~ /\. {
    return 404;
  }

  # `/docs/forms` is docs/forms.html, and `/docs` is docs/index.html.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
