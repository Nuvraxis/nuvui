packages:
  - apps/*
  - packages/*

# Comes in through sass-embedded for the Sass CLI's --watch flag, which we
# don't use. Its install script only compiles a fallback binary.
allowBuilds:
  "@parcel/watcher": false

catalog:
  "@playwright/test": 1.63.0
  "@types/node": ^24.0.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  playwright: 1.63.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
