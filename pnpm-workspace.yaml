packages:
  - apps/*
  - packages/*

# Install scripts are off unless listed as true. Neither of these needs its
# script: both ship a prebuilt binary as an optional dependency, and the
# script only exists to fetch or compile one when that's missing.
# @parcel/watcher comes in through sass-embedded, esbuild through fumadocs-mdx.
allowBuilds:
  "@parcel/watcher": false
  esbuild: false

catalog:
  "@playwright/test": 1.63.0
  "@types/node": ^24.0.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  playwright: 1.63.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
