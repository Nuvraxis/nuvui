  "@vitest/browser-playwright": ^5.0.5
  axe-core: ^4.13.0
  playwright: 1.63.0
  publint: ^0.3.25
  react: ^19.3.0
  react-dom: ^19.3.0
  react-is: ^19.3.0
  sass-embedded: ^1.105.1
  size-limit: 14.1.0
